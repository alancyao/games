.tsr-root {
  --s: 1;
  --ts: 1;
  --panel: rgba(12, 17, 23, 0.92);
  --panel-hi: rgba(22, 30, 41, 0.95);
  --border: #2a3644;
  --border-strong: #3b4b5e;
  --text: #dbe4ee;
  --bright: #f3f7fb;
  --muted: #8b9aac;
  --dim: #5e6c7c;
  --accent: #f2a93b;
  --accent-soft: rgba(242, 169, 59, 0.22);
  --minerals: #5cc8ff;
  --gas: #4cf09a;
  --supply: #e8eef5;
  --energy: #c48bff;
  --shields: #62b0ff;
  --hp0: #54f07a;
  --hp1: #e4ef55;
  --hp2: #ffa23a;
  --hp3: #ff4b3e;
  --danger: #ff5a4f;
  --warn: #ffd35c;
  --info: #8ff0c8;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Ubuntu, Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.tsr-root.tsr-race-protoss { --accent: #62e6f5; --accent-soft: rgba(98, 230, 245, 0.2); --accent-2: #c9a45c; }
.tsr-root.tsr-race-zerg { --accent: #b07cff; --accent-soft: rgba(176, 124, 255, 0.22); }
.tsr-root *, .tsr-root *::before, .tsr-root *::after { box-sizing: border-box; }
.tsr-root :where(button, input, select) { font: inherit; color: inherit; }
.tsr-root[hidden], .tsr-root [hidden] { display: none !important; }
.tsr-root kbd {
  display: inline-block; min-width: 1.6em; padding: 0 0.35em; border-radius: 3px; text-align: center;
  font: 700 calc(10px * var(--ts)) / 1.6 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color: #ffe39a; background: rgba(6, 9, 13, 0.8); border: 1px solid #3a4758; letter-spacing: 0;
}

#tessera-hud {
  position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
#tessera-hud .tsr-p { pointer-events: auto; }
.tsr-chrome {
  background: linear-gradient(180deg, rgba(21, 28, 38, 0.97), rgba(10, 14, 20, 0.97));
  border: 1px solid var(--border);
  box-shadow: 0 2px 14px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.045);
}

/* Top bar */
.tsr-topleft { position: absolute; left: 12px; top: 10px; display: flex; gap: 6px; align-items: stretch; }
.tsr-menubtn {
  display: flex; align-items: center; gap: 8px; height: calc(32px * var(--ts)); padding: 0 12px; cursor: pointer;
  border-radius: 4px; font-weight: 600; font-size: calc(13px * var(--ts)); letter-spacing: 0.04em;
}
.tsr-menubtn:hover { border-color: var(--accent); }
.tsr-clock {
  display: flex; align-items: center; gap: 8px; height: calc(32px * var(--ts)); padding: 0 12px; border-radius: 4px;
  font-weight: 700; font-size: calc(15px * var(--ts)); color: var(--bright); letter-spacing: 0.04em;
}
.tsr-clock i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.tsr-res { position: absolute; right: 12px; top: 10px; display: flex; gap: 6px; }
.tsr-res-item {
  display: flex; align-items: center; gap: 8px; height: calc(34px * var(--ts)); padding: 0 14px 0 8px; border-radius: 4px;
  font-weight: 700; font-size: calc(17px * var(--ts)); color: var(--bright); min-width: calc(92px * var(--ts));
}
.tsr-res-item img { width: calc(22px * var(--ts)); height: calc(22px * var(--ts)); }
.tsr-res-item.is-blocked { border-color: rgba(255, 90, 79, 0.7); }
.tsr-res-item.is-blocked span { color: var(--danger); }
.tsr-res-item.is-blocked::after {
  content: ""; position: absolute; inset: -1px; border-radius: 4px; pointer-events: none;
  box-shadow: 0 0 12px rgba(255, 90, 79, 0.45); animation: tsr-pulse 1.2s ease-in-out infinite;
}
.tsr-res-item { position: relative; }
@keyframes tsr-pulse { 50% { opacity: 0.25; } }
/* (game-fixes) Spectator: one resource row per player. */
.tsr-res.is-spectator { flex-direction: column; align-items: flex-end; }
.tsr-res-row { display: flex; gap: 6px; align-items: stretch; }
.tsr-res-name {
  display: flex; align-items: center; gap: 8px; height: calc(34px * var(--ts)); padding: 0 12px; border-radius: 4px;
  font-weight: 700; font-size: calc(13px * var(--ts)); color: var(--bright); letter-spacing: 0.03em; white-space: nowrap;
}
.tsr-res-name i { width: 10px; height: 10px; border-radius: 2px; box-shadow: 0 0 6px rgba(0, 0, 0, 0.6); }

/* Console */
.tsr-console { position: absolute; left: 0; right: 0; bottom: 0; height: calc(232px * var(--s)); display: flex; align-items: flex-end; }
.tsr-mm, .tsr-card, .tsr-center > .tsr-sel { position: relative; }
.tsr-mm { width: calc(232px * var(--s)); height: 100%; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; flex: none; }
.tsr-card { width: calc(348px * var(--s)); height: 100%; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; flex: none; }
.tsr-center { flex: 1 1 auto; min-width: 0; height: calc(186px * var(--s)); position: relative; }
.tsr-center > .tsr-sel { height: 100%; border-bottom: 0; }
.tsr-trim::before {
  content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px; pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--accent) 20%, var(--accent) 80%, transparent); opacity: 0.8;
}
.tsr-label {
  position: absolute; top: calc(6px * var(--s)); left: 12px; font-size: calc(9.5px * var(--ts)); font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);
}

/* Minimap */
.tsr-mm-frame {
  position: absolute; left: calc(10px * var(--s)); right: calc(10px * var(--s)); top: calc(22px * var(--s)); bottom: calc(10px * var(--s));
  border: 1px solid #34465a; border-radius: 3px; background: #05080c; box-shadow: inset 0 0 0 1px rgba(0,0,0,.6);
  overflow: hidden;
}
#tessera-minimap { display: block; width: 100%; height: 100%; cursor: crosshair; image-rendering: auto; }
.tsr-idle {
  position: absolute; left: 10px; bottom: calc(100% + 8px); width: calc(52px * var(--ts)); height: calc(52px * var(--ts));
  border-radius: 6px; cursor: pointer; padding: 0; overflow: visible;
}
.tsr-idle img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); }
/* (review-ui-input-render) The badge and the label paint outside the button over the game view. They take no
   pointer, so clicks and drag boxes there reach the game, and input's panel test sees open ground. */
.tsr-idle b {
  position: absolute; right: -6px; top: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  background: var(--accent); color: #0b0f14; font-size: calc(12px * var(--ts)); font-weight: 800; line-height: 20px; text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.6); pointer-events: none;
}
.tsr-idle:hover { border-color: var(--accent); }
.tsr-idle span {
  position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%); white-space: nowrap;
  font-size: calc(10px * var(--ts)); color: var(--muted); text-shadow: 0 1px 2px #000; pointer-events: none;
}

/* Control groups */
.tsr-groups { position: absolute; left: 10px; bottom: calc(100% + 5px); display: flex; gap: 4px; }
.tsr-group {
  position: relative; width: calc(58px * var(--ts)); height: calc(36px * var(--ts)); border-radius: 4px; cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding-right: 5px;
}
.tsr-group img { position: absolute; left: 13px; top: 3px; width: calc(28px * var(--ts)); height: calc(28px * var(--ts)); opacity: 0.95; }
.tsr-group em { position: absolute; left: 4px; top: 1px; font-style: normal; font-weight: 800; font-size: calc(11px * var(--ts)); color: #ffe39a; text-shadow: 0 1px 2px #000; }
.tsr-group b { position: relative; font-size: calc(11px * var(--ts)); font-weight: 700; color: var(--bright); text-shadow: 0 1px 2px #000; align-self: flex-end; margin-bottom: 2px; }
.tsr-group:hover, .tsr-group.is-current { border-color: var(--accent); }
.tsr-group.is-current { box-shadow: 0 0 0 1px var(--accent) inset, 0 0 10px var(--accent-soft); }

/* Selection panel */
.tsr-sel-body { position: absolute; left: calc(16px * var(--s)); right: calc(16px * var(--s)); top: calc(22px * var(--s)); bottom: calc(12px * var(--s)); }
.tsr-single { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.15fr); gap: calc(18px * var(--s)); height: 100%; }
.tsr-portrait {
  position: relative; width: calc(140px * var(--s)); height: 100%; max-height: calc(144px * var(--s)); border-radius: 4px; overflow: hidden;
  border: 1px solid var(--border-strong);
  background: radial-gradient(120% 90% at 30% 20%, #243244 0%, #111923 55%, #070b10 100%);
}
.tsr-portrait img { position: absolute; left: 50%; top: 45%; width: 92%; height: auto; aspect-ratio: 1; transform: translate(-50%, -50%); }
.tsr-portrait .tsr-bar { position: absolute; left: 6px; right: 6px; bottom: 6px; }
.tsr-bar { height: 5px; border-radius: 1px; background: rgba(0, 0, 0, 0.7); overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.tsr-bar > i { display: block; height: 100%; width: calc(var(--f, 1) * 100%); background: var(--c, var(--hp0)); transition: width 120ms linear; }
.tsr-bar + .tsr-bar { margin-top: 2px; }
.tsr-info { min-width: 0; display: flex; flex-direction: column; gap: calc(6px * var(--s)); padding-top: 2px; }
.tsr-name { font-size: calc(19px * var(--ts)); font-weight: 700; color: var(--bright); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tsr-tags { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: calc(10px * var(--ts)); font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.tsr-owner { padding: 1px 6px; border-radius: 3px; background: rgba(84, 240, 122, 0.12); color: #9ff5b4; }
.tsr-owner.is-enemy { background: rgba(255, 75, 62, 0.14); color: #ff9b91; }
.tsr-owner.is-neutral { background: rgba(255, 230, 150, 0.12); color: #f5e3a8; }
.tsr-vitals { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: calc(15px * var(--ts)); font-weight: 700; }
.tsr-vital { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.tsr-vital small { font-size: calc(9.5px * var(--ts)); letter-spacing: 0.12em; color: var(--dim); font-weight: 700; }
.tsr-vital.hp span { color: var(--c, var(--hp0)); }
.tsr-vital.sh span { color: var(--shields); }
.tsr-vital.en span { color: var(--energy); }
.tsr-vital.res span { color: var(--minerals); }
.tsr-vital.sat span, .tsr-vital.int span { color: var(--bright); }
.tsr-vital.sat.is-over span { color: #ffcf6a; }
.tsr-vital.sat span b, .tsr-vital.sat.is-over span b { font-weight: 700; color: var(--gas); }
.tsr-vital.sat span b.is-over { color: #ffcf6a; }
.tsr-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.tsr-chip {
  position: relative; display: flex; align-items: center; gap: 6px; height: calc(34px * var(--ts)); padding: 0 9px 0 3px; border-radius: 4px;
  background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.08); font-weight: 700; font-size: calc(13px * var(--ts)); color: var(--bright);
}
.tsr-chip img { width: calc(26px * var(--ts)); height: calc(26px * var(--ts)); border-radius: 3px; }
.tsr-chip small { color: var(--muted); font-weight: 600; font-size: calc(10.5px * var(--ts)); }
.tsr-chip sup {
  position: absolute; left: 4px; top: 3px; padding: 0 2px; border-radius: 2px; line-height: 1.25;
  font-size: calc(9px * var(--ts)); font-weight: 800; color: var(--accent); background: rgba(5, 8, 12, 0.82);
}
.tsr-chip sup:empty { display: none; }
.tsr-side { min-width: 0; display: flex; flex-direction: column; gap: calc(8px * var(--s)); border-left: 1px solid rgba(255,255,255,.06); padding-left: calc(18px * var(--s)); }
.tsr-side-title { font-size: calc(9.5px * var(--ts)); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.tsr-desc { font-size: calc(12.5px * var(--ts)); line-height: 1.45; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.tsr-queue { display: flex; gap: 6px; align-items: flex-end; }
.tsr-qitem {
  position: relative; flex: none; width: calc(44px * var(--ts)); height: calc(44px * var(--ts)); border-radius: 4px; padding: 0; cursor: pointer;
  background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.1);
}
.tsr-qitem img { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); }
.tsr-qitem.is-empty { border-style: dashed; border-color: rgba(255,255,255,.08); cursor: default; background: transparent; }
.tsr-qitem.is-big { width: calc(60px * var(--ts)); height: calc(60px * var(--ts)); border-color: var(--border-strong); }
.tsr-qitem:not(.is-empty):hover { border-color: var(--danger); }
.tsr-qitem:not(.is-empty):hover::after {
  content: "\\00d7"; position: absolute; right: 1px; top: -3px; font-size: 16px; font-weight: 800; color: var(--danger); text-shadow: 0 1px 2px #000;
}
.tsr-qitem .tsr-bar { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 4px; }
.tsr-progress { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.tsr-progress-row { display: flex; justify-content: space-between; gap: 10px; font-size: calc(12.5px * var(--ts)); font-weight: 600; color: var(--text); white-space: nowrap; }
.tsr-progress-row span:last-child { color: var(--muted); }
.tsr-bigbar { height: calc(8px * var(--s)); border-radius: 2px; background: rgba(0, 0, 0, 0.6); overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.07); }
.tsr-bigbar > i { display: block; height: 100%; width: calc(var(--f, 0) * 100%); background: linear-gradient(90deg, var(--accent), #fff3); }

.tsr-multi { position: absolute; inset: 0; display: flex; gap: 10px; }
.tsr-grid { flex: 1 1 auto; display: grid; align-content: start; grid-template-columns: repeat(auto-fill, calc(46px * var(--s))); grid-auto-rows: calc(46px * var(--s)); gap: calc(4px * var(--s)); overflow: hidden; }
.tsr-cell { position: relative; border-radius: 3px; cursor: pointer; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.07); padding: 0; }
.tsr-cell img { position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px); }
.tsr-cell.is-dim { opacity: 0.6; }
.tsr-cell.is-active { border-color: color-mix(in srgb, var(--accent) 70%, transparent); background: rgba(255, 255, 255, 0.06); }
.tsr-cell:hover { border-color: #fff8; opacity: 1; }
.tsr-cell .tsr-cbar { position: absolute; left: 3px; right: 3px; bottom: 2px; height: 3px; background: rgba(0, 0, 0, 0.75); }
.tsr-cell .tsr-cbar > i { display: block; height: 100%; width: calc(var(--f, 1) * 100%); background: var(--c, var(--hp0)); }
.tsr-cell .tsr-sbar { position: absolute; left: 3px; right: 3px; bottom: 6px; height: 2px; background: rgba(0, 0, 0, 0.75); }
.tsr-cell .tsr-sbar > i { display: block; height: 100%; width: calc(var(--f, 1) * 100%); background: var(--shields); }
.tsr-multi-side { flex: none; width: calc(128px * var(--ts)); display: flex; flex-direction: column; gap: 6px; border-left: 1px solid rgba(255,255,255,.06); padding-left: 10px; }
.tsr-multi-count { font-size: calc(24px * var(--ts)); font-weight: 800; color: var(--bright); line-height: 1; }
.tsr-multi-count small { display: block; font-size: calc(9.5px * var(--ts)); font-weight: 700; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; margin-top: 3px; }
.tsr-multi-active { font-size: calc(12px * var(--ts)); font-weight: 600; color: var(--text); line-height: 1.3; }
.tsr-multi-active span { color: var(--accent); }
.tsr-tabhint { font-size: calc(10px * var(--ts)); color: var(--dim); }
.tsr-pages { display: flex; gap: 4px; margin-top: auto; flex-wrap: wrap; }
.tsr-page { width: calc(24px * var(--ts)); height: calc(22px * var(--ts)); border-radius: 3px; padding: 0; cursor: pointer; font-size: calc(11px * var(--ts)); font-weight: 700; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); color: var(--muted); }
.tsr-page.is-current { border-color: var(--accent); color: var(--bright); }
.tsr-empty-sel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: calc(12px * var(--ts)); letter-spacing: 0.08em; }

/* Command card */
.tsr-cardgrid {
  position: absolute; left: calc(14px * var(--s)); right: calc(14px * var(--s)); top: calc(24px * var(--s)); bottom: calc(12px * var(--s));
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: calc(6px * var(--s));
}
.tsr-btn {
  position: relative; padding: 0; border-radius: 5px; cursor: pointer; overflow: hidden;
  background: linear-gradient(180deg, #223044 0%, #141c27 60%, #0f151d 100%);
  border: 1px solid #36475c; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 2px 5px rgba(0, 0, 0, 0.45);
  transition: border-color 80ms, transform 60ms;
}
.tsr-btn img { position: absolute; left: 7%; top: 7%; width: 86%; height: 86%; pointer-events: none; }
.tsr-btn:hover { border-color: var(--accent); }
.tsr-btn:active { transform: translateY(1px); }
.tsr-btn.is-empty { background: rgba(255, 255, 255, 0.018); border: 1px solid rgba(255, 255, 255, 0.04); box-shadow: none; cursor: default; pointer-events: none; }
.tsr-btn.is-empty > * { display: none; }
.tsr-hk {
  position: absolute; left: 3px; top: 3px; z-index: 2; padding: 0 3px; border-radius: 2px; line-height: 1.35;
  font-size: calc(11px * var(--ts)); font-weight: 800; color: #ffe39a; background: rgba(5, 8, 12, 0.78); pointer-events: none;
}
.tsr-cost {
  position: absolute; right: 2px; bottom: 2px; z-index: 2; display: flex; gap: 3px; padding: 0 3px; border-radius: 2px; line-height: 1.3;
  font-size: calc(9.5px * var(--ts)); font-weight: 700; background: rgba(5, 8, 12, 0.72); pointer-events: none;
}
.tsr-cost .m { color: var(--minerals); }
.tsr-cost .g { color: var(--gas); }
.tsr-cost .e { color: var(--energy); }
.tsr-btn.short-minerals .tsr-cost .m, .tsr-btn.short-gas .tsr-cost .g, .tsr-btn.short-energy .tsr-cost .e { color: var(--danger); }
.tsr-btn.short-supply::before { content: ""; position: absolute; inset: 0; z-index: 1; box-shadow: inset 0 0 0 1px rgba(255,90,79,.55); border-radius: 4px; pointer-events: none; }
.tsr-btn.is-disabled { background: linear-gradient(180deg, #1a212b, #10151c); border-color: #2a333f; }
.tsr-btn.is-disabled img { filter: grayscale(1) brightness(0.5); }
.tsr-btn.is-disabled .tsr-hk { color: #8993a0; }
.tsr-btn.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, 0 0 14px var(--accent-soft); }
.tsr-lvl {
  position: absolute; right: 3px; top: 3px; z-index: 2; min-width: calc(12px * var(--ts)); padding: 0 3px; border-radius: 2px; line-height: 1.35; text-align: center;
  font-size: calc(10.5px * var(--ts)); font-weight: 800; color: var(--bright); background: rgba(5, 8, 12, 0.8); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14); pointer-events: none;
}
.tsr-lvl:empty { display: none; }
.tsr-btn.is-autocast::after {
  content: ""; position: absolute; inset: 1px; z-index: 1; border-radius: 4px; pointer-events: none;
  border: 2px dashed rgba(255, 206, 92, 0.95); box-shadow: inset 0 0 9px rgba(255, 190, 70, 0.45);
}
.tsr-cd { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: conic-gradient(rgba(3, 6, 10, 0.72) calc(var(--cd, 0) * 360deg), transparent 0); }
.tsr-cdtext { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; font-size: calc(15px * var(--ts)); font-weight: 800; color: var(--bright); text-shadow: 0 1px 3px #000; pointer-events: none; }
.tsr-card-menu { position: absolute; right: 12px; top: calc(6px * var(--s)); font-size: calc(9.5px * var(--ts)); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }

/* Tooltip */
.tsr-tip {
  position: fixed; z-index: 45; width: min(330px, calc(100vw - 24px)); padding: 11px 13px 12px; border-radius: 6px; pointer-events: none;
  background: rgba(7, 11, 16, 0.97); border: 1px solid var(--border-strong); border-top: 2px solid var(--accent);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}
.tsr-tip-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tsr-tip-title { font-size: calc(14.5px * var(--ts)); font-weight: 700; color: var(--bright); }
.tsr-tip-costs { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 7px; font-size: calc(12.5px * var(--ts)); font-weight: 700; }
.tsr-tip-costs span { display: inline-flex; align-items: center; gap: 4px; }
.tsr-tip-costs img { width: 15px; height: 15px; }
.tsr-tip-costs .m { color: var(--minerals); }
.tsr-tip-costs .g { color: var(--gas); }
.tsr-tip-costs .s { color: var(--supply); }
.tsr-tip-costs .e { color: var(--energy); }
.tsr-tip-costs .t { color: var(--muted); }
.tsr-tip-costs .is-short { color: var(--danger); }
.tsr-tip-desc { margin-top: 7px; font-size: calc(12.5px * var(--ts)); line-height: 1.45; color: var(--muted); }
.tsr-tip-req { margin-top: 7px; font-size: calc(12.5px * var(--ts)); font-weight: 600; color: #ff8a80; }
.tsr-tip-reason { margin-top: 6px; font-size: calc(12px * var(--ts)); font-weight: 600; color: var(--warn); }

/* Alerts */
.tsr-alerts {
  position: absolute; left: 50%; bottom: calc(248px * var(--s)); transform: translateX(-50%); width: min(720px, 70vw);
  display: flex; flex-direction: column-reverse; align-items: center; gap: 4px;
}
.tsr-alert {
  padding: 5px 16px; border-radius: 4px; background: rgba(6, 9, 13, 0.72); text-shadow: 0 1px 2px #000; white-space: nowrap;
  font-size: calc(15px * var(--ts)); font-weight: 700; letter-spacing: 0.01em; animation: tsr-life var(--life, 2600ms) ease forwards;
}
.tsr-alert.error { color: var(--warn); }
.tsr-alert.alert { color: #ff8577; border-left: 3px solid var(--danger); }
.tsr-alert.info { color: var(--info); font-weight: 600; font-size: calc(14px * var(--ts)); }
/* (polish-from-critics) Attack alerts and info lines: a left column above the idle worker button.
   (review-ui-input-render) The offset follows that stack: console (232px * --s), the button's 8 px gap, the button
   (52px * --ts), its badge reaching 7 px above it, and a 14 px gap. The button scales with --ts, which stops at 0.88
   while --s goes down to 0.74, so one --s multiple cannot clear the badge on short viewports. */
.tsr-notices {
  position: absolute; left: 12px; bottom: calc(232px * var(--s) + 52px * var(--ts) + 29px); width: min(420px, 38vw);
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
}
.tsr-notices .tsr-alert { font-size: calc(14px * var(--ts)); padding: 4px 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@keyframes tsr-life { 0% { opacity: 0; transform: translateY(6px); } 5% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
.tsr-paused {
  pointer-events: none;
  position: absolute; left: 50%; top: 58px; transform: translateX(-50%); padding: 8px 26px; border-radius: 4px; text-align: center;
  font-size: calc(17px * var(--ts)); font-weight: 800; letter-spacing: 0.32em; color: var(--bright);
}
.tsr-paused small { display: block; margin-top: 3px; font-size: calc(10.5px * var(--ts)); font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }

/* Modal dialogs (menu, confirmation, controls) */
.tsr-modal {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(3, 6, 10, 0.72); pointer-events: auto;
}
.tsr-dialog {
  position: relative; width: min(430px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px 24px 24px; border-radius: 8px;
  background: linear-gradient(180deg, #141c27, #0b1017); border: 1px solid var(--border-strong); border-top: 2px solid var(--accent);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
}
.tsr-dialog.is-wide { width: min(760px, 100%); }
.tsr-dialog h2 { margin: 0 0 4px; font-size: calc(20px * var(--ts)); font-weight: 800; letter-spacing: 0.06em; color: var(--bright); }
.tsr-dialog p { margin: 0 0 12px; font-size: calc(13px * var(--ts)); color: var(--muted); line-height: 1.45; }
.tsr-mbtn {
  display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 8px; padding: 11px 14px; border-radius: 5px; cursor: pointer;
  background: #17212c; border: 1px solid #2f3e50; font-size: calc(14px * var(--ts)); font-weight: 650; text-align: left;
}
.tsr-mbtn:hover, .tsr-mbtn:focus-visible { border-color: var(--accent); background: #1b2733; outline: none; }
.tsr-mbtn.is-danger { color: #ff9b91; }
.tsr-mbtn.is-danger:hover { border-color: var(--danger); }
.tsr-mbtn.is-primary { background: var(--accent); color: #0b0f14; border-color: var(--accent); }
.tsr-row { display: flex; gap: 8px; }
.tsr-row > .tsr-mbtn { justify-content: center; }
.tsr-volume { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: calc(13px * var(--ts)); color: var(--muted); }
.tsr-volume input { flex: 1; accent-color: var(--accent); }
.tsr-volume output { width: 3em; text-align: right; color: var(--bright); font-weight: 700; }
.tsr-close { position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; background: transparent; border: 1px solid transparent; color: var(--muted); font-size: 18px; }
.tsr-close:hover { border-color: var(--border-strong); color: var(--bright); }
.tsr-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4px 28px; margin-top: 10px; }
.tsr-controls h3 { grid-column: 1 / -1; margin: 12px 0 2px; font-size: calc(10.5px * var(--ts)); font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.tsr-ctrl { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: calc(12.5px * var(--ts)); }
.tsr-ctrl span:first-child { color: var(--text); }
.tsr-ctrl span:last-child { color: #ffe39a; font-weight: 700; white-space: nowrap; text-align: right; }

/* Start screen */
.tsr-start { position: fixed; inset: 0; z-index: 60; overflow: auto; background: #04070b; }
.tsr-start-bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.tsr-start-wrap {
  position: relative; min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(360px, 460px); align-items: center;
  gap: 48px; padding: 48px clamp(20px, 7vw, 120px);
}
.tsr-hero { position: relative; min-width: 0; }
.tsr-kicker { display: flex; align-items: center; gap: 10px; font: 700 12px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.22em; color: #7fd8ff; text-transform: uppercase; }
.tsr-kicker i { display: inline-block; width: 26px; height: 2px; background: #f2a93b; }
.tsr-title {
  margin: 10px 0 0; font-size: clamp(52px, min(7vw, 13vh), 140px); font-weight: 900; line-height: 0.9; letter-spacing: 0.06em; color: #f4efe2;
  text-shadow: 0 6px 40px rgba(0, 0, 0, 0.6);
}
.tsr-title span { color: #f2a93b; }
.tsr-tagline { margin: 18px 0 0; max-width: 34em; font-size: clamp(16px, 1.5vw, 21px); line-height: 1.5; color: #c9d4df; }
.tsr-facts { display: flex; flex-wrap: wrap; gap: 14px 34px; margin-top: 30px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.1); }
.tsr-fact b { display: block; font: 700 13px/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.1em; color: #f3f7fb; }
.tsr-fact span { display: block; margin-top: 3px; font: 600 10.5px/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.12em; color: #7f8ea0; text-transform: uppercase; }
.tsr-setup {
  position: relative; padding: 26px 26px 22px; border-radius: 8px; background: linear-gradient(180deg, rgba(20, 30, 44, 0.94), rgba(10, 15, 22, 0.96));
  border: 1px solid #2f4056; border-top: 2px solid #f2a93b; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
}
.tsr-setup h2 { margin: 0; font-size: 24px; font-weight: 700; color: #f3f7fb; }
.tsr-eyebrow { font: 700 11px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em; color: #f2a93b; text-transform: uppercase; margin-bottom: 6px; }
.tsr-field { margin-top: 18px; }
.tsr-field-label { font: 700 10.5px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.16em; color: #8b9aac; text-transform: uppercase; margin-bottom: 8px; }
.tsr-races { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tsr-racecard {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 9px; border-radius: 6px; cursor: pointer;
  background: rgba(8, 12, 18, 0.7); border: 1px solid #2b3a4d; color: #aab7c6; transition: border-color 100ms, background 100ms, transform 100ms;
}
.tsr-racecard canvas { width: 76px; height: 76px; border-radius: 4px; }
.tsr-racecard span { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
.tsr-racecard:hover { border-color: #4b6078; transform: translateY(-1px); }
.tsr-racecard.is-selected { border-color: var(--rc, #f2a93b); background: rgba(255, 255, 255, 0.05); color: #f3f7fb; box-shadow: 0 0 0 1px var(--rc, #f2a93b) inset, 0 8px 24px rgba(0,0,0,.35); }
.tsr-racecard.is-selected::after { content: ""; position: absolute; right: 7px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--rc, #f2a93b); box-shadow: 0 0 8px var(--rc, #f2a93b); }
.tsr-racedesc { min-height: 3em; margin-top: 10px; font-size: 13px; line-height: 1.5; color: #9fb0c2; }
.tsr-diffdesc { min-height: 2.8em; margin-top: 8px; margin-bottom: 4px; font-size: 12.5px; }
.tsr-seg { display: flex; flex-wrap: wrap; gap: 4px; }
.tsr-seg button {
  flex: 1 1 0; min-width: 0; padding: 8px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 650;
  background: rgba(8, 12, 18, 0.7); border: 1px solid #2b3a4d; color: #aab7c6;
}
.tsr-seg button:hover { border-color: #4b6078; }
.tsr-seg button.is-selected { border-color: #f2a93b; color: #f3f7fb; background: rgba(242, 169, 59, 0.12); }
.tsr-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.tsr-input {
  width: 100%; padding: 8px 10px; border-radius: 4px; font: 600 13px/1.3 inherit; color: #f3f7fb;
  background: rgba(8, 12, 18, 0.8); border: 1px solid #2b3a4d; outline: none;
}
.tsr-input:focus { border-color: #f2a93b; }
.tsr-seedrow { display: flex; gap: 6px; }
.tsr-seedrow .tsr-input { flex: 1; font-family: ui-monospace, Menlo, Consolas, monospace; }
.tsr-iconbtn { flex: none; width: 36px; border-radius: 4px; cursor: pointer; background: rgba(8, 12, 18, 0.8); border: 1px solid #2b3a4d; color: #c9d4df; font-size: 16px; }
.tsr-iconbtn:hover { border-color: #f2a93b; }
.tsr-startbtn {
  display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 22px; padding: 14px 18px; border-radius: 5px; cursor: pointer;
  background: linear-gradient(180deg, #f5b955, #e39a2c); border: 1px solid #ffcf7a; color: #120c04; font-size: 15px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
  box-shadow: 0 8px 26px rgba(242, 169, 59, 0.28);
}
.tsr-startbtn:hover { filter: brightness(1.07); }
.tsr-startbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.tsr-linkbtn { display: block; margin: 14px auto 0; padding: 4px 8px; background: transparent; border: 0; cursor: pointer; font: 700 11px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.14em; color: #9fb0c2; text-transform: uppercase; }
.tsr-linkbtn:hover { color: #f3f7fb; }
@media (max-width: 900px) {
  .tsr-start-wrap { grid-template-columns: 1fr; gap: 28px; padding: 28px 16px; }
  .tsr-hero canvas.tsr-hero-art { display: none; }
}

/* Results */
.tsr-results { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; background: rgba(3, 6, 10, 0.84); }
.tsr-results-card { width: min(820px, 100%); padding: 30px 32px 28px; border-radius: 10px; background: linear-gradient(180deg, #131c27, #0a0f16); border: 1px solid #2f4056; box-shadow: 0 30px 90px rgba(0,0,0,.7); }
.tsr-results-card.is-victory { border-top: 3px solid #54f07a; }
.tsr-results-card.is-defeat { border-top: 3px solid #ff5a4f; }
.tsr-verdict { font-size: clamp(44px, 7vw, 76px); font-weight: 900; letter-spacing: 0.12em; line-height: 1; }
.is-victory .tsr-verdict { color: #9ff5b4; text-shadow: 0 0 40px rgba(84, 240, 122, 0.25); }
.is-defeat .tsr-verdict { color: #ff9b91; text-shadow: 0 0 40px rgba(255, 90, 79, 0.25); }
.tsr-verdict-sub { margin-top: 10px; font-size: 14px; color: #9fb0c2; letter-spacing: 0.04em; }
.tsr-stats { width: 100%; margin-top: 22px; border-collapse: collapse; font-size: 14px; }
.tsr-stats th, .tsr-stats td { padding: 9px 10px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.07); white-space: nowrap; }
.tsr-stats th:first-child, .tsr-stats td:first-child { text-align: left; }
.tsr-stats thead th { font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #7f8ea0; }
.tsr-stats tbody td { font-weight: 700; color: #f3f7fb; }
.tsr-stats tbody td:first-child { font-weight: 600; color: #aab7c6; }
.tsr-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: middle; }
.tsr-results-actions { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }
.tsr-results-actions button { padding: 12px 22px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.tsr-results-actions .primary { background: linear-gradient(180deg, #f5b955, #e39a2c); border: 1px solid #ffcf7a; color: #120c04; }
.tsr-results-actions .secondary { background: #17212c; border: 1px solid #2f3e50; color: #dbe4ee; }
.tsr-results-actions button:hover { filter: brightness(1.08); }
