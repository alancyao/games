<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fable Craft</title>

  #hud > * { pointer-events: auto; }
  #top-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 34px;
    display: flex; align-items: center; justify-content: flex-end; gap: 22px; padding: 0 14px;
    background: linear-gradient(180deg, rgba(8,14,24,.85), rgba(8,14,24,0));
    font-size: 15px; font-weight: 600; letter-spacing: .3px; text-shadow: 0 1px 2px #000;
    pointer-events: none;
  }
  #game-clock { position: absolute; left: 50%; transform: translateX(-50%); color: var(--muted); font-weight: 500; }
  #res-minerals { color: var(--minerals); }
  #res-gas { color: var(--gas); }
  #res-supply { color: var(--supply); }
  .res-low { color: var(--danger) !important; }

    position: absolute; left: 0; right: 0; bottom: 0; height: var(--console-h);
    display: grid; grid-template-columns: var(--console-inner) 1fr auto; grid-template-rows: minmax(0, 1fr); gap: 10px; padding: 8px 10px;
    background: linear-gradient(180deg, #0e1726 0%, var(--panel) 40%, #070c14 100%);
    border-top: 2px solid var(--edge);
    box-shadow: 0 -6px 24px rgba(0,0,0,.6);
  }
  #minimap-wrap { position: relative; width: 100%; height: 100%; border: 2px solid var(--edge); background: #000; }
  #minimap { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: crosshair; }
  #selection-panel { position: relative; border: 1px solid var(--edge); background: var(--panel-2); overflow: hidden; min-width: 200px; }
  #command-card { position: relative; display: grid; grid-template-columns: repeat(4, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; align-content: start; }
  #messages { position: absolute; left: 50%; bottom: calc(var(--console-h) + 14px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; font-size: 15px; text-shadow: 0 1px 3px #000; }

  #menu { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #0d1a2e 0%, #03060c 70%); z-index: 10; }
  #menu.open { display: flex; }

  button:hover { border-color: var(--edge-hi); }

  .menu-seg { display: flex; gap: 0; border: 1px solid var(--edge); background: rgba(0, 0, 0, .35); }
  .menu-seg button {
    flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 4px 8px; border: 0; border-right: 1px solid var(--edge); background: transparent;
    color: var(--muted); font-size: 14px; letter-spacing: .03em; transition: background .12s, color .12s;
  }

  .menu-seg button:hover { color: var(--text); background: rgba(79, 139, 214, .12); }
  .menu-seg button.on { color: #fff; background: linear-gradient(180deg, rgba(79, 139, 214, .45), rgba(44, 74, 110, .45)); box-shadow: inset 0 0 0 1px var(--edge-hi), inset 0 10px 18px rgba(120, 180, 255, .12); }
  .menu-seg button small { display: block; font-size: 11px; color: inherit; opacity: .7; }
  .menu-seg canvas { width: 28px; height: 28px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .5); }
  .menu-seed { display: flex; gap: 6px; }
  .menu-seed input {
    flex: 1; min-width: 0; font: inherit; font-variant-numeric: tabular-nums; color: var(--text); padding: 0 10px; min-height: 38px;
    background: rgba(0, 0, 0, .4); border: 1px solid var(--edge); outline: none;
  }
  .menu-seed input:focus { border-color: var(--edge-hi); box-shadow: 0 0 0 2px rgba(79, 139, 214, .25); }
  .menu-seed button { min-width: 44px; font-size: 18px; line-height: 1; }
  .menu-toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; color: var(--text); font-size: 14px; }
  .menu-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .menu-toggle .menu-knob { position: relative; width: 44px; height: 22px; border-radius: 11px; background: #1a2638; border: 1px solid var(--edge); transition: background .15s; }
  .menu-toggle .menu-knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #7f93ad; transition: transform .15s, background .15s; }
  .menu-toggle input:checked + .menu-knob { background: rgba(79, 139, 214, .55); border-color: var(--edge-hi); }
  .menu-toggle input:checked + .menu-knob::after { transform: translateX(22px); background: #fff; }
  .menu-toggle input:focus-visible + .menu-knob { box-shadow: 0 0 0 2px rgba(79, 139, 214, .4); }
  .menu-toggles { display: flex; gap: 26px; flex-wrap: wrap; }
  .menu-actions { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
  .menu-actions.stack { flex-direction: column; gap: 10px; margin-top: 6px; }
  .menu-btn {
    min-width: 200px; min-height: 46px; padding: 0 26px; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
    background: linear-gradient(180deg, #1b2c45, #101a2b); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 rgba(120, 170, 230, .25), 0 4px 14px rgba(0, 0, 0, .45);

  .menu-hint { color: var(--muted); font-size: 12.5px; letter-spacing: .06em; text-align: center; }

  @media (max-width: 760px) { .menu-help { column-count: 2; } }
  @media (max-width: 500px) { .menu-help { column-count: 1; } }
  .menu-help section { break-inside: avoid; margin-bottom: 12px; }
  .menu-help h3 { margin: 0 0 5px; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--edge-hi); }
  .menu-help dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; align-items: baseline; font-size: 13px; }
  .menu-title.compact h1 { font-size: 46px; }
  .menu-title.compact .menu-sub { margin-top: 4px; font-size: 11px; }
  .menu-help dt { white-space: nowrap; text-align: right; }
  .menu-help dd { margin: 0; color: var(--text); }
  .menu-pause-info { color: var(--muted); font-size: 13px; text-align: center; margin: -6px 0 12px; letter-spacing: .04em; }
  .menu-options { display: none; border-top: 1px solid var(--edge); margin-top: 12px; padding-top: 12px; }
  .menu-options.open { display: block; }

  .menu-result.defeat h1 { color: #ff5d5d; text-shadow: 0 0 24px rgba(255, 93, 93, .5), 0 2px 0 #3a0a0a; }

  .menu-stats { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .menu-stats th, .menu-stats td { padding: 7px 12px; border-bottom: 1px solid rgba(44, 74, 110, .5); }
  .menu-stats th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }
  .menu-stats td { text-align: right; }
  .menu-stats td.best { color: #fff; font-weight: 600; }
  .menu-stats thead th { text-align: right; color: var(--text); font-size: 14px; text-transform: none; letter-spacing: 0; padding-bottom: 10px; }
  .menu-stats thead th:first-child { text-align: left; }
  .menu-stats .menu-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .6); }
  .menu-stats .menu-race { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .menu-stats .menu-loser { color: var(--muted); }
  .menu-error pre { max-height: 220px; overflow: auto; margin: 10px 0 0; padding: 10px; background: rgba(0, 0, 0, .5); border: 1px solid rgba(255, 93, 93, .35); color: #ffb4b4; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  .menu-error h2 { color: var(--danger); }
  .menu-error p { margin: 0; color: var(--text); }
</style>
</head>
