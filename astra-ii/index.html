  // At most 1,024 recent frames are retained. World sprites are rendered at 2×
  // the usual 25px/tile zoom, keeping metal seams crisp on high-DPI displays.
  function getSprite(e,team,time) {
    const d=defs[e.type];
    const moving=!!e.orders?.length && ['move','attackMove','gather','construct','repair','load','unload'].includes(e.orders[0].kind);
    const animated=d.race==='zerg'||d.flying||['geyser','refinery','factory','pylon','warp_gate','cybernetics_core','spawning_pool','extractor','spore_crawler'].includes(e.type)||moving;
    const frame=animated?Math.floor(time*6)%4:0;
    const direction=d.kind==='unit'||d.weapon?Math.round((e.angle||0)/TAU*32):0;
    const form=`${!!e.sieged}${!!e.lowered}${!!e.vikingLanded}${!!e.phase}${['construct','repair'].includes(e.orders?.[0]?.kind)}`;
    const key=[e.type,team,direction,frame,form,moving?1:0,e.type==='mineral'?Math.round((e.amount??1800)/450):0].join(':');
    if(sprites.has(key)){const found=sprites.get(key);sprites.delete(key);sprites.set(key,found);return found;}
    const canvas=document.createElement('canvas');
    const building=d.kind==='building', resourceKind=d.kind==='resource';
    // Logical sprite bounds in normal-zoom pixels. Padding includes spires,
    // barrels, flight appendages and displaced cast shadows.
    const r=Math.max(11,(d.radius||.4)*25);
    const unitExtent=Math.ceil((e.type==='siege_tank'?40:d.flying||['queen','hydralisk','immortal'].includes(e.type)?34:29)*r/14)+4;
    const extent=building?(d.footprint||3)*25*.61+5:resourceKind?45:unitExtent;
    const top=building?(d.footprint||3)*25*1.03+8:resourceKind?65:unitExtent+5;
    const bottom=building?(d.footprint||3)*25*.44+8:resourceKind?30:unitExtent+2;
    canvas.width=Math.ceil(extent*4);canvas.height=Math.ceil((top+bottom)*2);
    const previous=c;c=canvas.getContext('2d');c.scale(2,2);c.translate(extent,top);
    if(building){c.scale((d.footprint||3)*25/100,(d.footprint||3)*25/100);if(d.race==='terran')terranBuilding(e.type,e,team,frame/6);else if(d.race==='protoss')protossBuilding(e.type,e,team,frame/6);else zergBuilding(e.type,e,team,frame/6);}
    else if(resourceKind)resource(e.type,e,frame/6);
    else{
      c.translate(0,-3);c.rotate(direction*TAU/32);c.scale(r/14,r/14);
      if(d.race==='terran')terranUnit(e.type,e,team,frame/6,moving?1:0);
      else if(d.race==='protoss')protossUnit(e.type,e,team,frame/6,moving?1:0);
      else zergUnit(e.type,e,team,frame/6,moving?1:0);
    }

    // source-atop mask confines texture to painted surfaces, never empty tiles.
    if(!grain){
      grain=document.createElement('canvas');grain.width=grain.height=96;const gc=grain.getContext('2d');let seed=7183;
      for(let i=0;i<1350;i++){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const x=seed%96;seed=(Math.imul(seed,1664525)+1013904223)>>>0;const y=seed%96;gc.fillStyle=i%3?'#071a2923':'#faf0cc26';gc.fillRect(x,y,i%13===0?3:1,1);}
    }
    c.save();c.resetTransform();c.globalCompositeOperation='source-atop';c.drawImage(grain,0,0,canvas.width,canvas.height);c.restore();

    if(sprites.size>1024)sprites.delete(sprites.keys().next().value);
    return out;
  }
